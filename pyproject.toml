[project]
name = "dataset-audit-studio"
version = "0.1.1"
description = "Local-first image training dataset audit and curation workbench"
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11.15,<3.12"
dependencies = [
  "alembic>=1.16,<2",
  "av>=14,<17",
  "fastapi>=0.116,<1",
  "faiss-cpu>=1.11,<2",
  "imagehash>=4.3,<5",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "open-clip-torch==3.3.0",
  "pillow>=11,<13",
  "pillow-avif-plugin>=1.5,<2",
  "pydantic>=2.11,<3",
  "safetensors>=0.5,<1",
  "sqlalchemy>=2.0,<3",
  "timm>=1.0.20,<2",
  "torch==2.9.1+cu128",
  "torchvision==0.24.1+cu128",
  "transformers==5.14.1",
  "uvicorn>=0.35,<1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/dataset_audit_studio"]

[dependency-groups]
dev = [
  "httpx2>=2.7,<3",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/dataset_audit_studio/components/artist_style/_lsnet"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
